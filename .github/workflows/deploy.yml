name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      # A relative base href, so the build works under /secop-dashboard/ or any other path.
      - run: npx ng build --base-href ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/secop-dashboard/browser
      - id: deployment
        uses: actions/deploy-pages@v4
